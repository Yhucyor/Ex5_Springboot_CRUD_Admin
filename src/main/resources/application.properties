spring.application.name=admin-crud
server.port=8090

# ===============================
# CHARACTER ENCODING - UTF-8
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8

# ===============================
# VIEW RESOLVER - JSP
# ===============================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# SiteMesh admin layout
sitemesh.decorator.prefix=/WEB-INF/decorators/
sitemesh.decorator.mappings[0].path=/admin/*
sitemesh.decorator.mappings[0].decorator=admin.jsp

# Static resources
spring.mvc.static-path-pattern=/static/**
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB


# ===============================
# DATABASE - SQL SERVER
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=jpa_crud;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
